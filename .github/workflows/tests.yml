name: Tests

# When to run: on every pull request, and on every push to main
# (merging a pull request counts as a push to main).
on:
  pull_request:
  push:
    branches: [main]

# The run may only read the repository, nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    # Wait for the test job, and skip this job if any test failed.
    needs: test
    # Only deploy on a push to main (a merge), never on a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sign in to Google Cloud
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          # Write the key to a temporary file outside the repository folder,
          # so it can never be uploaded with the source code.
          printf '%s' "$GCP_CREDENTIALS" > "$RUNNER_TEMP/key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/key.json"
          # Deploy to the project the deployer account belongs to.
          echo "PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/key.json")" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: gcloud run deploy grade-calculator --source . --region us-west1 --project "$PROJECT_ID" --quiet

      - name: Delete the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json"